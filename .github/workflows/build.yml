name: Rectify11

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    env:
      NUGET_CERT_REVOCATION_MODE: offline
      
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with: 
        token: ${{ secrets.GITHUB_TOKEN }}
        submodules: recursive
        lfs: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "8"

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: x64

    - name: Build Rectify11.Phase2
      shell: pwsh
      run: |
        dotnet publish Rectify11.Phase2/Rectify11.Phase2.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -o phase2_out -p:SolutionDir=${{ github.workspace }}\
        New-Item -ItemType Directory -Force -Path Rectify11Installer/Resources | Out-Null
        $exe = Get-ChildItem -Recurse -Filter "Rectify11.Phase2.exe" phase2_out | Select-Object -First 1
        $dll = Get-ChildItem -Recurse -Filter "Rectify11.Phase2.dll" phase2_out | Select-Object -First 1
        $cfg = Get-ChildItem -Recurse -Filter "Rectify11.Phase2.runtimeconfig.json" phase2_out | Select-Object -First 1
        if ($exe) { Copy-Item -Force $exe.FullName Rectify11Installer/Resources/ }
        if ($dll) { Copy-Item -Force $dll.FullName Rectify11Installer/Resources/ }
        if ($cfg) { Copy-Item -Force $cfg.FullName Rectify11Installer/Resources/ }

    - name: Build resource archives
      shell: pwsh
      run: |
        & Resources\Tools\7z.exe a -t7z Rectify11Installer\Resources\files.7z Resources\Files\* -mx9
        & Resources\Tools\7z.exe a -t7z Rectify11Installer\Resources\extras.7z Resources\Extras\* -mx9
        & Resources\Tools\7z.exe a -t7z Rectify11Installer\Resources\themes.7z Resources\Themes\* -mx9

    - name: Build C++ projects (Rectify11CPL, RectifyStart)
      shell: pwsh
      run: |
        msbuild RectifyControlPanel2\Rectify11CPL\Rectify11CPL.vcxproj /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0.22621.0 || echo "CPL build skipped"
        msbuild RectifyStart\RectifyStart.vcxproj /p:Configuration=Release /p:Platform=x64 || echo "RectifyStart build skipped"
        $cpl = Get-ChildItem -Recurse -Filter "Rectify11CPL.dll" | Select-Object -First 1
        $start = Get-ChildItem -Recurse -Filter "RectifyStart.exe" | Select-Object -First 1
        if ($cpl) { Copy-Item -Force $cpl.FullName Rectify11Installer/Resources/ }
        if ($start) { Copy-Item -Force $start.FullName Rectify11Installer/Resources/ }

    - name: Restore NuGet Packages
      run: dotnet restore Rectify11Installer/Rectify11Installer.csproj -r win-x64

    - name: Publish Full Rectify11 Installer EXE
      run: dotnet publish Rectify11Installer/Rectify11Installer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Platform=x64 -p:SolutionDir=${{ github.workspace }}\

    - name: Upload Rectify11Installer
      uses: actions/upload-artifact@v4
      with:
        name: Rectify11Installer (x64)
        path: Rectify11Installer/bin/Release/net8.0-windows/win-x64/publish/Rectify11Installer.exe
        retention-days: 7
