name: Rectify11

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    env:
      NUGET_CERT_REVOCATION_MODE: offline
      
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with: 
        token: ${{ secrets.GITHUB_TOKEN }}
        submodules: recursive
        lfs: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "8"

    - name: Build Rectify11.Phase2
      shell: pwsh
      run: |
        dotnet publish Rectify11.Phase2/Rectify11.Phase2.csproj -c Release -r win-x64 --self-contained false -o phase2_out
        New-Item -ItemType Directory -Force -Path Rectify11Installer/Resources | Out-Null
        Copy-Item -Force phase2_out/Rectify11.Phase2.exe Rectify11Installer/Resources/
        Copy-Item -Force phase2_out/Rectify11.Phase2.dll Rectify11Installer/Resources/
        Copy-Item -Force phase2_out/Rectify11.Phase2.runtimeconfig.json Rectify11Installer/Resources/

    - name: Restore NuGet Packages
      run: dotnet restore Rectify11Installer/Rectify11Installer.csproj -r win-x64

    - name: Publish Full Rectify11 Installer EXE
      run: dotnet publish Rectify11Installer/Rectify11Installer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Platform=x64 -p:SolutionDir=${{ github.workspace }}\

    - name: Upload Rectify11Installer
      uses: actions/upload-artifact@v4
      with:
        name: Rectify11Installer (x64)
        path: Rectify11Installer/bin/Release/net8.0-windows/win-x64/publish/Rectify11Installer.exe
        retention-days: 7
