name: CorePC Native Kernel CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        build_configuration: [Release, Debug]
        build_platform: [x64, ARM64]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure CMake
      run: >
        cmake -B ${{github.workspace}}/build 
        -DCMAKE_BUILD_TYPE=${{matrix.build_configuration}} 
        -A ${{matrix.build_platform}}
        -DBUILD_TESTING=${{ matrix.build_platform == 'x64' && 'ON' || 'OFF' }}

    - name: Build CorePC Binary Targets
      run: cmake --build ${{github.workspace}}/build --config ${{matrix.build_configuration}}

    - name: Run CorePC Regression Unit Tests
      if: matrix.build_platform == 'x64'
      run: ctest --test-dir ${{github.workspace}}/build -C ${{matrix.build_configuration}} --output-on-failure

    - name: Upload build artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: CorePC-${{ matrix.build_platform }}-${{ matrix.build_configuration }}
        path: |
          ${{github.workspace}}/build/**/*.exe
          ${{github.workspace}}/build/**/*.dll
          ${{github.workspace}}/build/**/*.lib
        retention-days: 7
