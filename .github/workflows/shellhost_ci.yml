name: Rectify11 Full Installer Build

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Rectify11 Installer
      run: dotnet restore Rectify11Installer/Rectify11Installer.csproj -r win-x64

    - name: Publish Full Rectify11 Installer EXE
      run: dotnet publish Rectify11Installer/Rectify11Installer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Platform=x64 -p:SolutionDir=${{ github.workspace }}\

    - name: Upload Full Rectify11 Installer EXE
      uses: actions/upload-artifact@v4
      with:
        name: Rectify11-Full-Installer-EXE
        path: Rectify11Installer/bin/x64/Release/net8.0-windows/win-x64/publish/Rectify11Installer.exe
        retention-days: 7
